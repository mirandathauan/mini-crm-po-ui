    <circle cx="620" cy="760" r="4"/>
    <circle cx="800" cy="680" r="5"/>
    <circle cx="100" cy="920" r="4"/>
    <circle cx="300" cy="980" r="6" filter="url(#blur)" opacity="0.6"/>
    <circle cx="500" cy="900" r="4"/>
