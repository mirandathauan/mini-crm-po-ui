    <circle cx="260" cy="260" r="4"/>
    <circle cx="460" cy="180" r="6" filter="url(#blur)" opacity="0.7"/>
    <circle cx="640" cy="320" r="4"/>
    <circle cx="820" cy="240" r="5"/>
    <circle cx="140" cy="420" r="4"/>
