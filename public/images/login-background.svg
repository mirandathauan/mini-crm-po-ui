<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060818"/>
      <stop offset="45%" stop-color="#0b1030"/>
      <stop offset="100%" stop-color="#1b1240"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7a5cff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
